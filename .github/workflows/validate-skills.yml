name: validate-skills

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pyyaml
        run: python3 -m pip install --quiet pyyaml
      - name: Validate SKILL.md files
        run: python3 scripts/validate.py
